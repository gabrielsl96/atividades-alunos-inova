<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora científica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="calc" aria-label="Calculadora científica">
  <div class="screen" aria-live="polite">
    <div class="hist" id="hist"></div>
    <div class="main" id="main">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-a="deg" id="deg" aria-label="Alternar graus e radianos">DEG</button>
    <button class="fn" data-i="(">(</button>
    <button class="fn" data-i=")">)</button>
    <button class="fn" data-a="back" aria-label="Apagar">⌫</button>
    <button class="fn" data-a="clear">AC</button>

    <button class="sci" data-i="sin(">sin</button>
    <button class="sci" data-i="cos(">cos</button>
    <button class="sci" data-i="tan(">tan</button>
    <button class="sci" data-i="√(" aria-label="Raiz quadrada">√</button>
    <button class="sci" data-i="^2" aria-label="Ao quadrado">x²</button>

    <button class="sci" data-i="asin(">sin⁻¹</button>
    <button class="sci" data-i="acos(">cos⁻¹</button>
    <button class="sci" data-i="atan(">tan⁻¹</button>
    <button class="sci" data-i="ln(">ln</button>
    <button class="sci" data-i="log(">log</button>

    <button data-i="7">7</button>
    <button data-i="8">8</button>
    <button data-i="9">9</button>
    <button class="op" data-i="÷" aria-label="Dividir">÷</button>
    <button class="sci" data-i="^" aria-label="Potência">xʸ</button>

    <button data-i="4">4</button>
    <button data-i="5">5</button>
    <button data-i="6">6</button>
    <button class="op" data-i="×" aria-label="Multiplicar">×</button>
    <button class="sci" data-i="!" aria-label="Fatorial">n!</button>

    <button data-i="1">1</button>
    <button data-i="2">2</button>
    <button data-i="3">3</button>
    <button class="op" data-i="−" aria-label="Subtrair">−</button>
    <button class="sci" data-i="π">π</button>

    <button data-i="0">0</button>
    <button data-i=".">,</button>
    <button class="fn" data-i="Ans">Ans</button>
    <button class="op" data-i="+" aria-label="Somar">+</button>
    <button class="sci" data-i="e">e</button>

    <button class="eq" data-a="eq" aria-label="Igual">=</button>
    <button class="sci" data-i="%">%</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
