<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>Calculadora</h1>
    <div class="calculator">
        <div class="display">
            <textarea name="display" aria-readonly="true" readonly></textarea>

        </div>
        <div class="botao">
            <button class="botao" id="botao-1">1</button>
            <button class="botao" id="botao-2">2</button>
            <button class="botao" id="botao-3">3</button>
            <button class="funcionalidade" id="funcionalidade-limpar">C</button>
            <button class="botao" id="botao-4">4</button>
            <button class="botao" id="botao-5">5</button>
            <button class="botao" id="botao-6">6</button>
            <button class="operador" id="operador-divisao">/</button>
            <button class="botao" id="botao-7">7</button>
            <button class="botao" id="botao-8">8</button>
            <button class="botao" id="botao-9">9</button>
            <button class="operador" id="operador-multiplicacao">*</button>
            <button class="botao" id="botao-0">0</button>
            <button class="operador" id="operador-soma">+</button>
            <button class="operador" id="operador-subtracao">-</button>
            <button class="funcionalidade" id="funcionalidade-calcular">=</button>
        </div>
            

       
    
</body>
</html>
