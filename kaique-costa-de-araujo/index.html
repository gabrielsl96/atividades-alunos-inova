<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <h1>Calculadora</h1>

    <div class="Calculator">
        <div class="display">
            <input type="text" name="display" readonly>
        </div>
        
       
        <div id="buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>

            <button>0</button>
            <button>C</button>
            <button>=</button>
            <button>/</button>      
        </div>
    </div>
</body>
</html>
