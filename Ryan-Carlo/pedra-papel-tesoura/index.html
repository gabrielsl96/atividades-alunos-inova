<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpô</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>JOKENPÔ</h1>
    
    <div id="score">Jogador: 0 | Computador: 0</div>
    
    <h4>Escolha uma opção:</h4>
    
    <div id="opcoes">
        <button id="pedra">&#x1f44a;</button>
        <button id="papel">✋</button>
        <button id="tesoura">✌</button>
    </div>

    <div id="resultado">Escolha uma opção para começar!</div>
    
    <button id="reset">🔄</button>

</body>
</html>
