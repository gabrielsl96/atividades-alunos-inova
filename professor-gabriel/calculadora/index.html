<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Calculadora</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>

<body>
    <h1>Calculadora</h1>

    <div class="calculator">
        <div class="display">
            <textarea name="display" readonly></textarea>
        </div>

        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>C</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>/</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>*</button>
            
            <button>.</button>
            <button>0</button>
            <button>-</button>
            <button>+</button>
            
            <button>=</button>
        </div>
    </div>

    </div>
</body>

</html>
