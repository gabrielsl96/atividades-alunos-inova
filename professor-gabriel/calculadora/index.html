<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Calculadora</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="./script.js" defer></script>
</head>

<body>
        <div id="calculator">
            <div class="display">
                <textarea name="display" id="display" readonly></textarea>
            </div>

        <div class="buttons">
            <button onClick="concatenateDisplay('7')">7</button>
            <button onClick="concatenateDisplay('8')">8</button>
            <button onClick="concatenateDisplay('9')">9</button>
            <button onClick="clearDisplay()">C</button>

            <button onClick="concatenateDisplay('4')">4</button>
            <button onClick="concatenateDisplay('5')">5</button>
            <button onClick="concatenateDisplay('6')">6</button>
            <button onClick="concatenateDisplay('/')">/</button>

            <button onClick="concatenateDisplay('1')">1</button>
            <button onClick="concatenateDisplay('2')">2</button>
            <button onClick="concatenateDisplay('3')">3</button>
            <button onClick="concatenateDisplay('*')">*</button>

            <button onClick="concatenateDisplay('.')">.</button>
            <button onClick="concatenateDisplay('0')">0</button>
            <button onClick="concatenateDisplay('-')">-</button>
            <button onClick="concatenateDisplay('+')">+</button>

            <button onClick="calculate()">=</button>
        </div>
    </div>

    </div>
</body>

</html>
