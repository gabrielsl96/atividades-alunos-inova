<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Calculadora</h1>
    
    <div class="calculadora">
  <div class="visor">0</div>
  
  <div class="teclado">
    <!-- Linha 1 -->
    <button class="btn-coracao operacao"><span>C</span></button>
    <button class="btn-coracao operacao"><span>(</span></button>
    <button class="btn-coracao operacao"><span>)</span></button>
    <button class="btn-coracao operacao"><span>/</span></button>

    <!-- Linha 2 -->
    <button class="btn-coracao"><span>7</span></button>
    <button class="btn-coracao"><span>8</span></button>
    <button class="btn-coracao"><span>9</span></button>
    <button class="btn-coracao operacao"><span>*</span></button>

    <!-- Linha 3 -->
    <button class="btn-coracao"><span>4</span></button>
    <button class="btn-coracao"><span>5</span></button>
    <button class="btn-coracao"><span>6</span></button>
    <button class="btn-coracao operacao"><span>-</span></button>

    <!-- Linha 4 -->
    <button class="btn-coracao"><span>1</span></button>
    <button class="btn-coracao"><span>2</span></button>
    <button class="btn-coracao"><span>3</span></button>
    <button class="btn-coracao operacao"><span>+</span></button>

    <!-- Linha 5 -->
    <button class="btn-coracao"><span>0</span></button>
    <button class="btn-coracao"><span>.</span></button>
    <button class="btn-coracao igual"><span>=</span></button>
  </div>
</div>
    


</body>
</html>
